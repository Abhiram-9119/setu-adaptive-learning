  S.cur=S.root||target();S.phase="diag";S.why="";return r()}
 if(ph=="solve"){const v=S.sv;if(ok&&!S.hint)v.st++;else v.st=0;if(ok)v.wr=0;else{v.wr++;v.wt++}v.n++;
  if(v.st>=2){v.lvl=Math.min(3,v.lvl+1);v.st=0;S.why=L(["2 right in a row without hints: harder questions now.","बिना संकेत 2 सही: अब कठिन प्रश्न।"])}
  if(v.wr>=2){v.lvl=Math.max(1,v.lvl-1);v.wr=0;S.why=L(["2 wrong in a row: easier questions now.","लगातार 2 गलत: अब आसान प्रश्न।"])}
  if(v.wt>=3&&!v.alt){v.alt=1;S.v1=1;S.phase="learn";S.why=L(["You got 3 wrong, so here is a different explanation.","3 गलत हुए, इसलिए दूसरा तरीका।"]);return r()}
  nextSolve();return r()}
 const e=S.te;if(ok)e.ok++;else if(S.fb.tag)e.tags[S.fb.tag]=(e.tags[S.fb.tag]||0)+1;e.i++;
 if(e.i<e.ids.length){ask(e.ids[e.i]);return r()}
 const pct=Math.round(e.ok/e.ids.length*100);S.res={c:S.cur,pct,ok:e.ok,n:e.ids.length,tags:e.tags};
 if(pct>=80){S.passed[S.cur]=true;S.alert=0}else if(pct<60)S.alert=1;S.phase="result";r()}
function afterResult(){const x=S.res;if(x.pct>=80){const n=nextTopic();if(!n){S.phase="fin"}else{S.cur=n;S.v1=0;S.phase="learn";S.sv=null;S.why=L([nm(x.c)+" passed. "+nm(n)+" is unlocked.",nm(x.c)+" पास। "+nm(n)+" खुल गया।"])}}
 else if(x.pct>=60){S.sv=null;S.why=L(["Between 60% and 79%: targeted practice, then retest.","60% से 79%: अभ्यास, फिर पुनः परीक्षा।"]);solveGo();return}
 else{S.v1=1;S.phase="learn";S.sv=null;S.why=L(["Below 60%: re-learn with a different explanation, then retest.","60% से कम: दूसरे तरीके से फिर सीखें।"])}r()}
const canAssign=c=>chain().includes(c)&&CHN.slice(0,CHN.indexOf(c)).every(done);
function assign(c){if(S.phase=="home"||!canAssign(c))return;S.cur=c;S.v1=0;S.sv=null;S.phase="learn";S.tab=0;S.why=L(["Your teacher assigned this topic.","शिक्षक ने यह विषय दिया है।"]);r()}
function map(){const X=[8,258,508],f=c=>S.passed[c]?"#DFF3E8":S.ok[c]?"#EAF7F0":"#fff";let s='<svg viewBox="0 0 710 118" width="100%" role="img"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5B6086"/></marker></defs>';
 CHN.forEach((c,j)=>{const root=S.root===c,cur=S.phase!="home"&&S.cur===c&&!root,col=root?"#E0483E":cur?"#4338CA":S.passed[c]?"#1F9D63":"#C9CDE8";
  s+=`<rect x="${X[j]}" y="26" width="194" height="64" rx="14" fill="${root?"#FCE6E3":f(c)}" stroke="${col}" stroke-width="${root||cur?4:2}"/><text x="${X[j]+97}" y="50" text-anchor="middle" font-size="13" fill="#5B6086">${t("cl")} ${CN[c][2]}</text><text x="${X[j]+97}" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#16193B">${esc(L(CN[c]))}</text>`;
  if(root||cur||S.ok[c]&&!S.passed[c])s+=`<text x="${X[j]+97}" y="16" text-anchor="middle" font-size="13" font-weight="700" fill="${root?"#E0483E":cur?"#4338CA":"#1F9D63"}">${root?t("gap"):cur?t("here"):t("okc")}</text>`;
  if(j<2)s+=`<line x1="${X[j]+198}" y1="58" x2="${X[j+1]-6}" y2="58" stroke="#5B6086" stroke-width="2.5" marker-end="url(#a)"/>`});
 return s+`</svg><div class="sm">${t("map")}</div>`}
function dash(){const ch=chain(),p=S.phase=="home"?0:Math.round(ch.filter(done).length/ch.length*100),st={qc:0,diag:0,learn:1,solve:2,test:3,result:3}[S.phase];
 return`<div class="card"><h3>${t("hello")}, ${esc(S.name||"…")} · ${t("cl")} ${S.cls}</h3><div class="st">${["qc","learn","sol","test"].map((k,i)=>`<span class="${i===st?"cur":""}">${t(k)}</span>`).join("")}</div><div class="sm" style="margin-top:6px">${t("prog")}: ${p}%</div><div class="bar"><i style="width:${p}%"></i></div>${map()}</div>`}
function student(){const p=S.phase;
 if(p=="home"){const o=[6,7,8,9,10].map(c=>`<option value="${c}" ${S.cls==c?"selected":""} ${TG[c]?"":"disabled"}>${t("cl")} ${c}${TG[c]?"":" ("+t("soon")+")"}</option>`).join("");
  return`<div class="card"><h2>${t("sub")}</h2><label>${t("name")}</label><input value="${esc(S.name)}" oninput="S.name=this.value;sv()" maxlength="30"><div class="g2"><div><label>${t("cls")}</label><select onchange="S.cls=+this.value;r()">${o}</select></div><div><label>${t("lang")}</label><select onchange="S.lang=+this.value;r()"><option value="0" ${S.lang?"":"selected"}>English</option><option value="1" ${S.lang?"selected":""}>हिन्दी</option></select></div></div><p class="sm">${t("sup")}</p>${S.nameErr&&!S.name.trim()?`<div class="fb no">${t("nreq")}</div>`:""}<button class="p" onclick="begin()">${t("start")}</button></div>`+dash()}
 let h=dash()+(S.why?`<div class="why"><b>${t("why")}:</b> ${S.why}</div>`:"");
 if(p=="diag"){const lines=S.sum.map(([c,n])=>`<li>${nm(c)}: ${n}/2</li>`).join(""),ml=Object.entries(S.log).sort((a,b)=>b[1]-a[1])[0];
  const why=S.root?L(["Your answers suggest a possible gap in "+nm(S.root)+", the deepest topic where answers looked weak. Setu starts there, because topics that depend on it may stay hard until it is solid.","आपके उत्तर "+nm(S.root)+" में संभावित कमी दिखाते हैं, जहाँ उत्तर सबसे कमज़ोर थे। Setu यहीं से शुरू करता है, क्योंकि इस पर निर्भर विषय कठिन रह सकते हैं।"]):t("rdy");
  return h+`<div class="card"><h2>${t("d1")}</h2><ul>${lines}</ul><p>${why}</p>${ml?`<p class="sm">${L(MIS[ml[0]])}</p>`:""}<div class="why">${t("dn")}</div><button class="p" onclick="${S.root?"S.v1=0;S.phase='learn';r()":"startTest();r()"}">${S.root?t("toL"):t("toT")}</button></div>`}
 if(p=="learn"){const le=LES[S.cur][S.v1];return h+`<div class="card"><span class="chip">${nm(S.cur)}</span><h2>${t("learn")}${S.v1?" · "+t("alt"):""}</h2><p>${L(le[0])}</p><div class="why"><b>${t("exm")}:</b> ${L(le[1])}</div><button class="p" onclick="solveGo()">${t("go")}</button></div>`}
 if(p=="result"){const x=S.res,pass=x.pct>=80,tg=Object.keys(x.tags).map(k=>L(MIS[k])).join(" ");
  return h+`<div class="card"><span class="chip">${nm(x.c)}</span><h2>${t("sc")}: ${x.ok}/${x.n} = ${x.pct}%</h2><div class="fb ${pass?"ok":"no"}">${pass?t("pass"):L(x.pct>=60?U.rv1:U.rv2)}</div>${tg?`<p class="sm">${tg}</p>`:""}${pass?`<button class="p" onclick="afterResult()">${nextTopic()?t("unl")+": "+nm(nextTopic()):t("cont")}</button>`:`<button class="p" onclick="afterResult()">${t("rvb")}</button><button onclick="startTest();r()">${t("rt")}</button>`}</div>`}
 if(p=="fin")return h+`<div class="card"><h2>🎉</h2><p>${t("fin")}</p><button onclick="S=Object.assign(fresh(),{lang:S.lang,name:S.name,cls:S.cls});r()">${t("rst")}</button></div>`;
 const q=S.q,lab=p=="qc"?t("qc")+" · "+nm(chain()[S.qc.i])+" · "+(S.qc.k+1)+"/2":p=="test"?t("test")+" · "+(S.te.i+1)+"/5":t("sol")+" · "+t("qn")+" "+(S.sv.n+1)+"/5";
 h+=`<div class="card"><span class="chip">${lab}</span><p>${t("find")}</p><h2 style="font-size:30px">${q.q}</h2>`;
 if(S.fb){const f=S.fb;h+=q.o.map(o=>`<div class="card" style="margin:6px 0;padding:10px;font-size:20px">${o.x}${!o.tag?" ✓":""}</div>`).join("")+`<div class="fb ${f.ok?"ok":"no"}"><b>${t(f.ok?"ok":"no")}</b> ${f.ok?"":t("ans")+": "+f.a+". "+(f.tag?L(MIS[f.tag]):"")}</div><button class="p" onclick="nxt()">${t("next")}</button></div>`}
 else{h+=q.o.map((o,i)=>`<button class="o" onclick="answer(${i})">${o.x}</button>`).join("");if(p=="solve")h+=S.hint?`<div class="why">💡 ${L(HINT[q.c])}</div>`:`<button onclick="S.hint=1;r()">💡 ${t("hint")}</button>`;h+="</div>"}
 return h}
function wsheet(){const c=S.ws,qs=Q.filter(d=>d[1]==c);return`<div class="card ws"><div class="np"><button onclick="S.ws=null;r()">← ${t("bk")}</button><button class="p" onclick="window.print()">${t("pr")}</button></div><h2>Setu ${t("ws")}: ${nm(c)}</h2><p>${t("nm")}</p><ol>${qs.map(d=>`<li>${d[3]}  =  ______</li>`).join("")}</ol><p class="sm">${t("key")}: ${qs.map((d,i)=>(i+1)+") "+d[4]).join("  ")}</p></div>`}
function grp(){const live=S.phase!="home",rows=[...(live?[[(S.name||"Live student")+" (live)",CHN.map(stat).join("")]]:[]),...SEED],gr={};
 rows.forEach(r=>{const c=r[1],j=[...c].findIndex(x=>x!="G"&&x!="A");let k;
  if(j<0)k=c.includes("G")?"ext":"tst";else if(c[j]=="N")k=(j>0&&c[j-1]=="G")?"rdn":"nst";else k="rev"+CHN[j];
  (gr[k]=gr[k]||[]).push(r[0])});return{rows,gr}}
function apprGroup(k){const g=grp().gr[k];if(g)S.appr[k]=g.join("|");r()}
function teacher(){if(S.ws)return wsheet();const live=S.phase!="home",{rows,gr}=grp();
 const gk=["revINT","revTRN","revLIN","rdn","tst","nst","ext"].filter(k=>gr[k]),gt=k=>k.startsWith("rev")?t("rev")+": "+nm(k.slice(3)):t(k);
 const mp=Object.entries(S.log).map(([k,v])=>`${L(MIS[k])} (×${v})`).join("<br>");
 const opts=CHN.filter(c=>chain().includes(c)).map(c=>`<option value="${c}" ${canAssign(c)?"":"disabled"}>${nm(c)}${canAssign(c)?"":" ("+t("lk")+")"}</option>`).join("");
 return`<h2>${t("tw")}</h2><div class="why">${t("fic")}</div>${S.alert?`<div class="fb no">${t("al")}</div>`:""}<div class="card"><table><tr><th></th>${CHN.map(c=>`<th>${esc(L(CN[c]))}<br><small>${t("cl")} ${CN[c][2]}</small></th>`).join("")}</tr>${rows.map(r=>`<tr><td>${esc(r[0])}</td>${[...r[1]].map(s=>`<td><span class="d ${s}"></span></td>`).join("")}</tr>`).join("")}</table><div class="sm"><span class="d G"></span> Strong &nbsp;<span class="d A"></span> ${t("ag")} &nbsp;<span class="d L"></span> Learning &nbsp;<span class="d R"></span> Gap &nbsp;<span class="d N"></span> ${t("nst")}</div></div>
 <div class="card"><h3>${t("cm")}</h3>${CHN.map((c,j)=>{const n=rows.filter(r=>r[1][j]=="G").length,p=Math.round(n/rows.length*100);return`<div class="sm">${nm(c)}: ${n}/${rows.length}</div><div class="bar"><i style="width:${p}%"></i></div>`}).join("")}</div>
 <h3>${t("grp")}</h3>${gk.map(k=>`<div class="card"><b>${gt(k)}</b> · ${gr[k].length}<br><span class="sm">${gr[k].map(esc).join(", ")}</span><br><button class="${S.appr[k]===gr[k].join("|")?"on":""}" onclick="apprGroup('${k}')">${t(S.appr[k]===gr[k].join("|")?"apd":"ap")}</button>${k.startsWith("rev")?`<button onclick="S.ws='${k.slice(3)}';r()">${t("ws")}</button>`:""}</div>`).join("")}
 <div class="card"><h3>${t("mis")}</h3><p class="sm">${mp||t("none")}</p><label>${t("as")}</label>${live?`<select id="asg">${opts}</select><button class="p" onclick="assign(D.getElementById('asg').value)">${t("asb")}</button>`:`<p class="sm">${t("noS")}</p>`}</div>`}
const D=document;
function r(){try{D.getElementById("sub").textContent=t("sub");D.getElementById("nav").innerHTML=`<button class="${S.tab?"":"on"}" onclick="S.tab=0;r()">${t("stu")}</button><button class="${S.tab?"on":""}" onclick="S.tab=1;r()">${t("tea")}</button><button onclick="S.lang=1-S.lang;r()">${S.lang?"EN":"हिं"}</button>`;D.getElementById("app").innerHTML=S.tab?teacher():student();sv()}catch(e){console.error(e);S=fresh();sv();try{D.getElementById("app").innerHTML=student()}catch(e2){}}}
r();
</script></body></html>
